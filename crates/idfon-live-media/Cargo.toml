[package]
name = "idfon-live-media"
version.workspace = true
edition = "2021"
license.workspace = true

[dependencies]
anyhow = "1"
base64 = "0.23"
bytes = "1"
ed25519-dalek = "3"
idfon-core = { path = "../idfon-core" }
idfon-protocol = { path = "../idfon-protocol" }
iroh = "1"
iroh-live = { git = "https://github.com/n0-computer/iroh-live", rev = "9abd29be2da2564cf295225ba630a34f62daa7a4", default-features = false }
moq-audio = { version = "0.1", default-features = false }
moq-media = { git = "https://github.com/n0-computer/iroh-live", rev = "9abd29be2da2564cf295225ba630a34f62daa7a4", package = "moq-media", default-features = false }
moq-net = { git = "https://github.com/donpark/moq", branch = "loss-recovery-release" }
n0-future = "0.3.2"
serde_json = "1"
tokio = { version = "1", features = ["fs", "rt-multi-thread", "macros", "io-util", "net", "sync", "time"] }
futures-util = "0.3"
