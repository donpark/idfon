[[bin]]
name = "eve-idfon-cascade"
path = "src/main.rs"

[dependencies]
anyhow = "1"
eve-idfon = { path = "../eve-idfon" }
idfon-voice = { path = "../idfon-voice" }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
