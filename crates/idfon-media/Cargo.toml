[package]
name = "idfon-media"
version.workspace = true
edition = "2021"
license.workspace = true

[features]
default = []
linux-vaapi = ["iroh-live/vaapi"]

[lib]
crate-type = ["rlib"]

[dependencies]
anyhow = "1"
bytes = "1"
iroh = "1"
# No "capture" feature: idfon is headless audio (file source + cpal), and
# capture drags rusty-capture -> pipewire -> libspa on Linux, which fails to
# compile against Ubuntu 22.04/24.04 headers (needs PipeWire 1.x). Re-add only
# if video capture is ever needed, and only on runners with pipewire >= 1.x.
# Capture also belongs to the caller, not the daemon (see docs/audio-media.md,
# "Capture ownership and lifecycle authority"): CLI mic/camera input goes in
# idfon-cli or a caller-linked source, never as a feature here.
# "h264" is the always-available software fallback (openh264). Hardware H.264
# is added per target at the bottom of this file; both advertise plain H.264
# on the wire, so the choice affects CPU/battery, not interop. The pipeline
# picks it via `VideoCodec::best_available()`.
iroh-live = { git = "https://github.com/n0-computer/iroh-live", rev = "a130f15f06c3dea8a73fc87d76c729793b33ac97", default-features = false, features = ["opus", "h264"] }
# fMP4/MKV/TS/FLV/H.264 import (video file demuxing) and the in-memory
# broadcast pair used to replay imported tracks. Versions must stay in lock
# with what iroh-live resolves to (see Cargo.lock).
moq-mux = "0.5.6"
moq-lite = { package = "moq-net", version = "0.1.18" }
hang = "0.20"
idfon-core = { path = "../idfon-core" }
idfon-protocol = { path = "../idfon-protocol" }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread"] }
serde_json = "1"

[dev-dependencies]
tracing-subscriber = "0.3"

# Hardware H.264 in the Rust pipeline: VideoToolbox (Apple) / VAAPI (Linux).
# Target-gated because moq-media's `vaapi` feature pulls `cros-codecs`
# unconditionally, which does not build on non-Linux.
[target.'cfg(target_os = "macos")'.dependencies]
iroh-live = { git = "https://github.com/n0-computer/iroh-live", rev = "a130f15f06c3dea8a73fc87d76c729793b33ac97", default-features = false, features = ["opus", "h264", "videotoolbox"] }

[target.'cfg(target_os = "linux")'.dependencies]
iroh-live = { git = "https://github.com/n0-computer/iroh-live", rev = "a130f15f06c3dea8a73fc87d76c729793b33ac97", default-features = false, features = ["opus", "h264"] }
