[package]
name = "idfon-media"
version.workspace = true
edition = "2021"
license.workspace = true

[features]
default = []
linux-vaapi = ["iroh-live/vaapi"]

[lib]
crate-type = ["rlib"]

[dependencies]
anyhow = "1"
bytes = "1"
futures-util = "0.3"
iroh = "1"
# No "capture" feature: idfon is headless audio (file source + cpal), and
# capture drags rusty-capture -> pipewire -> libspa on Linux, which fails to
# compile against Ubuntu 22.04/24.04 headers (needs PipeWire 1.x). Re-add only
# if video capture is ever needed, and only on runners with pipewire >= 1.x.
# Capture also belongs to the caller, not the daemon (see docs/audio-media.md,
# "Capture ownership and lifecycle authority"): CLI mic/camera input goes in
# idfon-cli or a caller-linked source, never as a feature here.
# Current moq-video owns codec/backend selection. Idfon supplies frames and
# chooses renditions; the upstream encoder selects the available backend.
iroh-live = { git = "https://github.com/n0-computer/iroh-live", rev = "de7f43bfc466988f08b7e63acdd7fb295a9f9fd2", default-features = false }
moq-media = { git = "https://github.com/n0-computer/iroh-live", rev = "de7f43bfc466988f08b7e63acdd7fb295a9f9fd2", package = "moq-media", default-features = false, features = ["capture", "playback"] }
moq-audio = { version = "0.0.23", default-features = false, features = ["aac", "capture", "playback"] }
moq-video = "0.0.23"
n0-future = "0.3.2"
# rustix 1.1.5 currently fails to compile with hick's limited feature set.
rustix = "=1.1.4"
jpeg-encoder = "0.7"
# fMP4/MKV/TS/FLV/H.264 import (video file demuxing) and the in-memory
# broadcast pair used to replay imported tracks. Versions must stay in lock
# with what iroh-live resolves to (see Cargo.lock).
moq-mux = "0.9.14"
idfon-core = { path = "../idfon-core" }
idfon-protocol = { path = "../idfon-protocol" }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread"] }
serde_json = "1"

[dev-dependencies]
tracing-subscriber = "0.3"

# Hardware H.264 in the Rust pipeline: VideoToolbox (Apple) / VAAPI (Linux).
# Target-gated because moq-media's `vaapi` feature pulls `cros-codecs`
# unconditionally, which does not build on non-Linux.
[target.'cfg(target_os = "macos")'.dependencies]
iroh-live = { git = "https://github.com/n0-computer/iroh-live", rev = "de7f43bfc466988f08b7e63acdd7fb295a9f9fd2", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
iroh-live = { git = "https://github.com/n0-computer/iroh-live", rev = "de7f43bfc466988f08b7e63acdd7fb295a9f9fd2", default-features = false }
