[package]
name = "idfon-mcp-server"
version.workspace = true
edition = "2021"
license.workspace = true

[[bin]]
name = "idfon-mcp-server"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
idfon-client = { path = "../idfon-client" }
idfon-protocol = { path = "../idfon-protocol" }
idfon-telemetry = { path = "../idfon-telemetry", features = ["otlp"] }
serde_json = "1"