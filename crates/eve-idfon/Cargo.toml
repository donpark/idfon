[package]
name = "eve-idfon"
version.workspace = true
edition = "2021"
license.workspace = true

[[bin]]
name = "eve-idfon"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.23"
blake3 = "1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
ed25519-dalek = "3"
idfon-core = { path = "../idfon-core" }
idfon-h3 = { path = "../idfon-h3" }
idfon-media = { path = "../idfon-media" }
idfon-protocol = { path = "../idfon-protocol" }
idfon-telemetry = { path = "../idfon-telemetry", features = ["otlp"] }
iroh = "1"
iroh-blobs = "0.103"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tokio = { version = "1", features = ["fs", "rt-multi-thread", "macros", "io-util", "net", "sync", "time"] }
# The generic holder still installs a rustls provider for iroh's TLS; the live
# media stack lives in the voice-agent runner (`idfon-voice-agent`), not here.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
futures-util = "0.3"
getrandom = { version = "0.4", features = ["sys_rng"] }
