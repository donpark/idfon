[package]
name = "idfon-voice"
version.workspace = true
edition = "2021"
license.workspace = true

[lib]
crate-type = ["rlib"]

[features]
default = []
# Swift-implemented Apple engine behind a C ABI (iOS only; see src/apple_ffi.rs).
apple-ffi = []
# Cloud voice engine over an OpenAI-compatible AI Gateway (see src/gateway.rs).
# Demo/pragmatic server-side engine; offline/local engines remain the target.
gateway = ["dep:reqwest", "dep:futures-util", "dep:tokio-websockets"]

[dependencies]
anyhow = "1"
idfon-protocol = { path = "../idfon-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time"] }
futures-util = { version = "0.3", optional = true, features = ["sink"] }
tokio-websockets = { version = "0.13", optional = true, default-features = false, features = ["client", "ring", "rustls-webpki-roots", "getrandom"] }
reqwest = { version = "0.13", optional = true, default-features = false, features = ["json", "multipart", "rustls", "stream"] }
