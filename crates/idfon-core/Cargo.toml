[package]
name = "idfon-core"
version.workspace = true
edition = "2021"
license.workspace = true

[dependencies]
ed25519-dalek = { version = "3", features = ["rand_core"] }
blake3 = "1"
iroh = "1.0"
idfon-protocol = { path = "../idfon-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
thiserror = "2"
tracing = "0.1"
futures-util = "0.3"
rand_core = "0.10"

# The security helpers in `lib.rs` are shared with the Cloudflare Worker
# (wasm32-unknown-unknown); `transport` is native-only (gossip, tokio io are not
# available on wasm). Tokio's `rt-multi-thread` is rejected by the wasm target.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
iroh-gossip = "0.101"
tokio = { version = "1", features = ["rt-multi-thread", "time", "io-util", "sync"] }
getrandom = { version = "0.4", features = ["sys_rng"] }

[target.'cfg(target_family = "wasm")'.dependencies]
tokio = { version = "1", features = ["rt", "time", "io-util", "sync", "macros"] }
getrandom = { version = "0.4", features = ["wasm_js"] }
