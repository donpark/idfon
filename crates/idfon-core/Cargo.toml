[package]
name = "idfon-core"
version.workspace = true
edition = "2021"
license.workspace = true

[dependencies]
ed25519-dalek = { version = "3", features = ["rand_core"] }
blake3 = "1"
iroh = "1.0"
iroh-gossip = "0.101"
idfon-protocol = { path = "../idfon-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "io-util", "sync"] }
futures-util = "0.3"
rand_core = "0.10"
getrandom = { version = "0.4", features = ["sys_rng"] }
