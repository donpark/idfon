[package]
name = "idfon-cli"
version.workspace = true
edition = "2021"
license.workspace = true

[[bin]]
name = "idfon"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
idfon-client = { path = "../idfon-client" }
idfon-protocol = { path = "../idfon-protocol" }
idfon-telemetry = { path = "../idfon-telemetry" }
serde_json = "1"
