[package]
name = "idfon-channel"
version.workspace = true
edition = "2021"
license.workspace = true
description = "WebSocket-shaped message channels over one ordered iroh bi-stream, with no HTTP in the path."

[dependencies]
bytes = "1"
idfon-core = { path = "../idfon-core" }
iroh = "1"
tokio = { version = "1", features = ["rt", "io-util", "sync", "macros"] }
tracing = "0.1"

[dev-dependencies]
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
http = "1"
idfon-h1 = { path = "../idfon-h1" }
idfon-protocol = { path = "../idfon-protocol" }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.29"
