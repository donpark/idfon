[package]
name = "idfon-daemon"
version.workspace = true
edition = "2021"
license.workspace = true

[features]
default = []
linux-vaapi = ["idfon-media/linux-vaapi"]

[dependencies]
anyhow = "1"
axum = "0.8"
blake3 = "1"
futures-util = "0.3"
iroh-gossip = "0.101"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
iroh = "1"
iroh-blobs = "0.103"
libc = "0.2"
ed25519-dalek = "3"
rusqlite = { version = "0.40", features = ["bundled"] }
idfon-core = { path = "../idfon-core" }
idfon-gateway = { path = "../idfon-gateway" }
idfon-h3 = { path = "../idfon-h3" }
idfon-media = { path = "../idfon-media" }
idfon-protocol = { path = "../idfon-protocol" }
idfon-telemetry = { path = "../idfon-telemetry" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tokio = { version = "1", features = ["fs", "macros", "net", "io-util", "process", "rt-multi-thread", "signal", "time"] }

[dev-dependencies]
idfon-mcp = { path = "../idfon-mcp" }
