[package]
name = "idfon-daemon"
version.workspace = true
edition = "2021"
license.workspace = true

[dependencies]
anyhow = "1"
blake3 = "1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
iroh = "1"
iroh-blobs = "0.103"
libc = "0.2"
ed25519-dalek = "2"
idfon-core = { path = "../idfon-core" }
idfon-media = { path = "../idfon-media" }
idfon-protocol = { path = "../idfon-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "macros", "net", "io-util", "rt-multi-thread", "signal", "time"] }
