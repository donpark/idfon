[package]
name = "iroh-c-ffi"
version = "0.101.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
crate-type = [
  "staticlib",  # Ensure it gets compiled as a (static) C library
  "cdylib",     # If you want a shared/dynamic C library (advanced)
  "lib",        # For `generate-headers` and other downstream rust dependents
                # such as integration `tests/`, doctests, and `examples/`
]

[[bin]]
name = "generate_headers"
required-features = ["headers"]  # Do not build unless generating headers.

[dependencies]
anyhow = "1"
bytes = "1.10"
buf-list = "1.1"
iroh = "1.0.0"
iroh-tickets = "1.0.0"
iroh-blobs = "0.103.0"
# Camera capture is shell-pushed on Apple platforms (Swift AVCaptureSession
# -> media_video_push_frame -> PushFrameSource); the nokhwa-backed capture
# path is only needed where no Swift shell exists (Linux/v4l), and comes
# transitively from iroh-live's capture-camera feature (crates.io nokhwa —
# the vendored fork is deleted: its patches were Apple-only). The deps are
# split per-target so Apple builds don't compile any nokhwa tree.
# Note: in this iroh-live rev the native AVFoundation capture backend is an
# unimplemented stub, hence capture-camera/nokhwa features on Linux only.
[target.'cfg(target_os = "linux")'.dependencies]
iroh-live = { git = "https://github.com/n0-computer/iroh-live", rev = "a130f15f06c3dea8a73fc87d76c729793b33ac97", default-features = false, features = ["opus", "h264", "capture-camera"] }
moq-media = { git = "https://github.com/n0-computer/iroh-live", rev = "a130f15f06c3dea8a73fc87d76c729793b33ac97", default-features = false, features = ["nokhwa"] }
[target.'cfg(not(target_os = "linux"))'.dependencies]
iroh-live = { git = "https://github.com/n0-computer/iroh-live", rev = "a130f15f06c3dea8a73fc87d76c729793b33ac97", default-features = false, features = ["opus", "h264"] }
moq-media = { git = "https://github.com/n0-computer/iroh-live", rev = "a130f15f06c3dea8a73fc87d76c729793b33ac97", default-features = false }
# macOS camera permission request (camera access is also requested from the
# Swift shells; this covers daemon-side starts); features unify with
# rusty-capture's objc2-av-foundation.
objc2 = "0.6"
objc2-av-foundation = { version = "0.3", features = ["AVCaptureDevice", "AVMediaFormat", "block2"] }
block2 = "0.6"
once_cell = "1.21"
jpeg-encoder = "0.6"
rand = "0.10"
safer-ffi = { version = "0.1.13" ,features = ["async-fn"]}
socket2 = "0.6.1"
tokio = { version = "1.45.1", features = ["rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
url = "2.5"
n0-future = "0.3.0"
data-encoding = "2.9.0"
ogg = "0.9.2"
iroh-mdns-address-lookup = "0.4.0"
idfon-protocol = { path = "../../../crates/idfon-protocol" }
idfon-client = { path = "../../../crates/idfon-client" }
idfon-daemon = { path = "../../../crates/idfon-daemon" }

[features]
# generate headers
headers = ["safer-ffi/headers"]

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# Vendored nokhwa: the Linux-gated direct dep already points at this path,
# so no patch is needed for it; keep the entry only if a transitive dep ever
# pulls crates.io nokhwa again.
[patch.crates-io]