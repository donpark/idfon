[package]
name = "iroh-c-ffi"
version = "0.101.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
crate-type = [
  "staticlib",  # Ensure it gets compiled as a (static) C library
  "cdylib",     # If you want a shared/dynamic C library (advanced)
  "lib",        # For `generate-headers` and other downstream rust dependents
                # such as integration `tests/`, doctests, and `examples/`
]

[[bin]]
name = "generate_headers"
required-features = ["headers"]  # Do not build unless generating headers.

[dependencies]
anyhow = "1"
bytes = "1.10"
buf-list = "1.1"
iroh = "1.0.0"
iroh-tickets = "1.0.0"
iroh-blobs = "0.103.0"
# Camera capture is shell-pushed on Apple platforms (Swift AVCaptureSession
# -> media_video_push_frame -> PushFrameSource). No C-FFI consumer captures
# on Linux (the CLI's idfond publishes video from files via idfon-media),
# so capture-camera/rusty-capture/v4l2r/nokhwa are compiled nowhere: the
# v4l2r 0.0.7 bindgen also fails against Ubuntu 22.04 kernel headers
# (missing AV1/VP9 stateless controls).
iroh-live = { git = "https://github.com/n0-computer/iroh-live", rev = "de7f43bfc466988f08b7e63acdd7fb295a9f9fd2", default-features = false }
# macOS camera permission request (camera access is also requested from the
# Swift shells; this covers daemon-side starts). objc2 hard-fails to compile
# on non-Apple platforms, hence the target gate; ensure_camera_access is
# cfg(any(macos, ios)) so nothing references these on Linux.
tokio = { version = "1.45.1", features = ["rt-multi-thread"] }
once_cell = "1.21"
jpeg-encoder = "0.7"
rand = "0.10"
safer-ffi = { version = "0.1.13" ,features = ["async-fn"]}
socket2 = "0.6.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
url = "2.5"
n0-future = "0.3.0"
data-encoding = "2.9.0"
ogg = "0.9.2"
iroh-mdns-address-lookup = "0.5.0"
moq-media = { git = "https://github.com/n0-computer/iroh-live", rev = "de7f43bfc466988f08b7e63acdd7fb295a9f9fd2", package = "moq-media", default-features = false, features = ["capture"] }
moq-audio = { git = "https://github.com/Frando/moq", branch = "iroh-live-3", default-features = false, features = ["aac", "capture", "playback"] }
moq-video = { git = "https://github.com/Frando/moq", branch = "iroh-live-3" }
moq-net = { git = "https://github.com/Frando/moq", branch = "iroh-live-3" }
moq-mux = { git = "https://github.com/Frando/moq", branch = "iroh-live-3" }
idfon-protocol = { path = "../../../crates/idfon-protocol" }
idfon-client = { path = "../../../crates/idfon-client" }
idfon-daemon = { path = "../../../crates/idfon-daemon" }

# objc2 hard-fails to compile on non-Apple platforms, hence the target gate.
[target.'cfg(not(target_os = "linux"))'.dependencies]
objc2 = "0.6"
objc2-av-foundation = { version = "0.3", features = ["AVCaptureDevice", "AVMediaFormat", "block2"] }
block2 = "0.6"

# Hardware H.264 in the Rust pipeline: VideoToolbox on Apple, VAAPI on Linux.
# Both advertise plain H.264 on the wire (VtbEncoder/VaapiEncoder report the
# same H.264 wire format); current moq-video selects the available backend.
# Target-gated because moq-media's `vaapi` feature pulls `cros-codecs`
# unconditionally, which does not build on non-Linux.
[target.'cfg(target_os = "macos")'.dependencies]
iroh-live = { git = "https://github.com/n0-computer/iroh-live", rev = "de7f43bfc466988f08b7e63acdd7fb295a9f9fd2", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
iroh-live = { git = "https://github.com/n0-computer/iroh-live", rev = "de7f43bfc466988f08b7e63acdd7fb295a9f9fd2", default-features = false }

# ponytail note: a 4f94b3e regression put tokio and the idfon-* deps inside
# a not(linux) target section and silently broke the Linux dylib (tokio
# without rt-multi-thread -> iroh-blobs fs-store failed to compile). Keep
# everything except objc2 unconditional.
[features]
default = ["linux-vaapi"]
# Enable Linux hardware H.264 encoding. The CLI release disables this because
# GitHub's Ubuntu runners have incompatible libva headers; native Linux builds
# keep it enabled by default.
linux-vaapi = ["iroh-live/vaapi", "idfon-daemon/linux-vaapi"]
# generate headers
headers = ["safer-ffi/headers"]

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# Match the MoQ development snapshot selected by the current iroh-live rev.
[patch.crates-io]
hang = { git = "https://github.com/Frando/moq", branch = "iroh-live-3" }
moq-audio = { git = "https://github.com/Frando/moq", branch = "iroh-live-3" }
moq-mux = { git = "https://github.com/Frando/moq", branch = "iroh-live-3" }
moq-net = { git = "https://github.com/Frando/moq", branch = "iroh-live-3" }
moq-video = { git = "https://github.com/Frando/moq", branch = "iroh-live-3" }
moq-media = { git = "https://github.com/n0-computer/iroh-live", rev = "de7f43bfc466988f08b7e63acdd7fb295a9f9fd2" }
iroh-moq = { git = "https://github.com/n0-computer/iroh-live", rev = "de7f43bfc466988f08b7e63acdd7fb295a9f9fd2" }

# Vendored nokhwa: the Linux-gated direct dep already points at this path,
# so no patch is needed for it; keep the entry only if a transitive dep ever
# pulls crates.io nokhwa again.