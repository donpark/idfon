[package]
name = "iroh-c-ffi"
version = "0.101.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
crate-type = [
  "staticlib",  # Ensure it gets compiled as a (static) C library
  "cdylib",     # If you want a shared/dynamic C library (advanced)
  "lib",        # For `generate-headers` and other downstream rust dependents
                # such as integration `tests/`, doctests, and `examples/`
]

[[bin]]
name = "generate_headers"
required-features = ["headers"]  # Do not build unless generating headers.

[dependencies]
anyhow = "1"
bytes = "1.10"
buf-list = "1.1"
iroh = "1.0.0"
iroh-tickets = "1.0.0"
iroh-blobs = "0.103.0"
iroh-live = { git = "https://github.com/n0-computer/iroh-live", rev = "a130f15f06c3dea8a73fc87d76c729793b33ac97", default-features = false, features = ["opus", "capture"] }
once_cell = "1.21"
rand = "0.10"
safer-ffi = { version = "0.1.13" ,features = ["async-fn"]}
socket2 = "0.6.1"
tokio = { version = "1.45.1", features = ["rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
url = "2.5"
n0-future = "0.3.0"
data-encoding = "2.9.0"
ogg = "0.9.2"
iroh-mdns-address-lookup = "0.4.0"
nufon-protocol = { path = "../../../crates/nufon-protocol" }
serde_json = "1"

[features]
# generate headers
headers = ["safer-ffi/headers"]

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
