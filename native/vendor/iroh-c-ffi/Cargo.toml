[package]
name = "iroh-c-ffi"
version = "0.101.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
crate-type = [
  "staticlib",  # Ensure it gets compiled as a (static) C library
  "cdylib",     # If you want a shared/dynamic C library (advanced)
  "lib",        # For `generate-headers` and other downstream rust dependents
                # such as integration `tests/`, doctests, and `examples/`
]

[[bin]]
name = "generate_headers"
required-features = ["headers"]  # Do not build unless generating headers.

[dependencies]
anyhow = "1"
bytes = "1.10"
buf-list = "1.1"
iroh = "1.0.0"
iroh-tickets = "1.0.0"
iroh-blobs = "0.103.0"
iroh-live = { git = "https://github.com/n0-computer/iroh-live", rev = "a130f15f06c3dea8a73fc87d76c729793b33ac97", default-features = false, features = ["opus", "h264", "capture-camera"] }
# Enables rusty-capture's nokhwa backend: the native AVFoundation camera
# backend in this iroh-live rev is an unimplemented stub that always errors
# ("AVFoundation camera capture is not yet implemented"). Same source as
# iroh-live's internal moq-media dep, so features unify.
moq-media = { git = "https://github.com/n0-computer/iroh-live", rev = "a130f15f06c3dea8a73fc87d76c729793b33ac97", default-features = false, features = ["nokhwa"] }
# macOS camera permission request (nokhwa's device query does not trigger
# the TCC prompt); features unify with rusty-capture's objc2-av-foundation.
objc2 = "0.6"
objc2-av-foundation = { version = "0.3", features = ["AVCaptureDevice", "AVMediaFormat", "block2"] }
block2 = "0.6"
once_cell = "1.21"
jpeg-encoder = "0.6"
rand = "0.10"
safer-ffi = { version = "0.1.13" ,features = ["async-fn"]}
socket2 = "0.6.1"
tokio = { version = "1.45.1", features = ["rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
url = "2.5"
n0-future = "0.3.0"
data-encoding = "2.9.0"
ogg = "0.9.2"
iroh-mdns-address-lookup = "0.4.0"
idfon-protocol = { path = "../../../crates/idfon-protocol" }
idfon-client = { path = "../../../crates/idfon-client" }
idfon-daemon = { path = "../../../crates/idfon-daemon" }

[features]
# generate headers
headers = ["safer-ffi/headers"]

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# Lock-rejection tolerance for multi-process camera sharing (see
# vendor/nokhwa-bindings-macos set_all): another process streaming the
# camera holds the system-exclusive config lock; without this the second
# instance's camera open fails (two app instances on one Mac).
[patch.crates-io]
nokhwa-bindings-macos = { path = "../nokhwa-bindings-macos" }
block = { path = "../block" }
