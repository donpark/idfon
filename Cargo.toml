[workspace]
resolver = "2"
members = ["crates/idfon-protocol", "crates/idfon-telemetry", "crates/idfon-core", "crates/idfon-media", "crates/idfon-voice", "crates/idfon-gateway", "crates/idfon-h3", "crates/idfon-edge", "crates/idfon-mcp", "crates/idfon-mcp-server", "crates/eve-idfon", "crates/idfon-live-media", "crates/idfon-voice-agent", "crates/idfon-director", "crates/idfond", "crates/idfon-cli", "crates/idfon-client", "crates/idfon-daemon", "crates/iroh-c-ffi"]

[workspace.package]
license = "MIT OR Apache-2.0"
version = "0.9.0"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[patch.crates-io]
# Fork branch of Frando/moq `iroh-live-3` (same base commit as before) carrying
# decode-side loss recovery (Decoder::recover + Consumer `conceal`) and a
# working encoder FEC knob; mirrors the upstream PR to moq-dev/moq. All five
# crates point at the one branch so their internal path-deps unify to a single
# instance each (mixing two git sources splits moq_net/moq_mux types).
# Snaps back to Frando (or the upstream release) once the PR lands.
# Match the MoQ development snapshot selected by the current iroh-live rev.
hang = { git = "https://github.com/donpark/moq", branch = "loss-recovery-0.0.23" }
moq-audio = { git = "https://github.com/donpark/moq", branch = "loss-recovery-0.0.23" }
moq-mux = { git = "https://github.com/donpark/moq", branch = "loss-recovery-0.0.23" }
moq-net = { git = "https://github.com/donpark/moq", branch = "loss-recovery-0.0.23" }
moq-video = { git = "https://github.com/donpark/moq", branch = "loss-recovery-0.0.23" }
moq-media = { git = "https://github.com/n0-computer/iroh-live", rev = "de7f43bfc466988f08b7e63acdd7fb295a9f9fd2" }
# Match the MoQ development snapshot selected by the current iroh-live rev.
iroh-moq = { git = "https://github.com/n0-computer/iroh-live", rev = "de7f43bfc466988f08b7e63acdd7fb295a9f9fd2" }
