[workspace]
resolver = "2"
members = ["crates/nufon-protocol", "crates/nufon-core", "crates/nufon-media", "crates/nufond", "crates/nufon-cli", "crates/nufon-client", "crates/nufon-daemon"]
exclude = ["native/vendor/iroh-c-ffi"]

[workspace.package]
version = "0.2.0"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
