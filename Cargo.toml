[workspace]
resolver = "2"
members = ["crates/idfon-protocol", "crates/idfon-telemetry", "crates/idfon-core", "crates/idfon-media", "crates/idfon-voice", "crates/idfon-gateway", "crates/idfon-h3", "crates/idfon-edge", "crates/idfon-mcp", "crates/idfon-mcp-server", "crates/eve-idfon", "crates/idfon-live-media", "crates/idfon-voice-agent", "crates/idfon-director", "crates/idfond", "crates/idfon-cli", "crates/idfon-client", "crates/idfon-daemon", "crates/iroh-c-ffi"]

[workspace.package]
license = "MIT OR Apache-2.0"
version = "0.9.0"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[patch.crates-io]
# Fork branch of moq-dev/moq `main` (post history-rewrite; the old lineage is
# frozen and has no common ancestor with it) carrying decode-side loss
# recovery (Decoder::recover + Consumer `conceal`), a working encoder FEC knob
# (upstream removed theirs as ineffective; ours also sets the loss-rate hint
# libopus needs to write the LBRR copy), and the shared BitrateControl. Keep
# the fork patched until these land upstream; all five crates point at the one
# branch so their internal path-deps unify to a single instance each (mixing
# two git sources splits moq_net/moq_mux types). Update procedure:
# docs/moq-fork.md.
hang = { git = "https://github.com/donpark/moq", branch = "loss-recovery-release" }
moq-audio = { git = "https://github.com/donpark/moq", branch = "loss-recovery-release" }
moq-mux = { git = "https://github.com/donpark/moq", branch = "loss-recovery-release" }
moq-net = { git = "https://github.com/donpark/moq", branch = "loss-recovery-release" }
moq-video = { git = "https://github.com/donpark/moq", branch = "loss-recovery-release" }
moq-tokio = { git = "https://github.com/donpark/moq", branch = "loss-recovery-release" }
moq-media = { git = "https://github.com/n0-computer/iroh-live", rev = "9abd29be2da2564cf295225ba630a34f62daa7a4" }
# Match the MoQ development snapshot selected by the current iroh-live rev.
iroh-moq = { git = "https://github.com/n0-computer/iroh-live", rev = "9abd29be2da2564cf295225ba630a34f62daa7a4" }
