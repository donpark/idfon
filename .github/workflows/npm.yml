# Build the npm distribution (npm/idfon shim + npm/idfon-* platform
# packages) on native runners, smoke-test it, and publish on npm-v* tags.
#
# Publishing is gated until the repo goes public: it only fires on tags, and
# needs NPM_TOKEN plus the platform packages are unscoped; only the name `idfon` must be free on npmjs.com beforehand.
name: npm

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "native/vendor/iroh-c-ffi/**"
      - "npm/**"
      - "scripts/build-npm.sh"
      - ".github/workflows/npm.yml"
  pull_request:
    paths:
      - "crates/**"
      - "native/vendor/iroh-c-ffi/**"
      - "npm/**"
      - "scripts/build-npm.sh"
      - ".github/workflows/npm.yml"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners only — no cross toolchains, except the darwin-x64
          # leg: x86_64-apple-darwin is a native-SDK cross (no extra tools) on
          # arm64 macOS, which also sidesteps the macos-13 (Intel) runner
          # queue starvation. If a runner name is unavailable, swap it;
          # ubuntu-24.04-arm is the fallback for ubuntu-22.04-arm (at the
          # cost of a newer glibc floor).
          - { os: macos-14, pkg: idfon-darwin-arm64 }
          - { os: macos-14, pkg: idfon-darwin-x64, target: x86_64-apple-darwin }
          - { os: ubuntu-22.04, pkg: idfon-linux-x64 }
          - { os: ubuntu-22.04-arm, pkg: idfon-linux-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # cpal → ALSA only since the capture feature is off (no pipewire dep).
      # alsa-sys needs libasound2 headers + pkg-config to link.
      - name: Install audio dev libs (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      # x86_64 binaries run under Rosetta on the arm64 runner (smoke test).
      - name: Install Rosetta (darwin-x64 cross)
        if: matrix.target == 'x86_64-apple-darwin'
        run: /usr/sbin/softwareupdate --install-rosetta --agree-to-license || true
      - name: Build binaries into platform package
        run: ./scripts/build-npm.sh ${{ matrix.target }}
      - name: Smoke test (resolve + spawn via shim)
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            # Cross-built: runner arch != binary arch, so the shim would
            # resolve the wrong platform package. Spawn the built binary
            # directly — exercises the binary + shipped dylib rpath via
            # Rosetta. (Shim resolution is covered by the host legs.)
            version="$(npm/${{ matrix.pkg }}/bin/idfon --version)"
          else
            version="$(node npm/idfon/bin/idfon.js --version)"
          fi
          echo "idfon --version -> $version"
          expected="idfon $(node -p "require('./npm/idfon/package.json').version")"
          [ "$version" = "$expected" ] || { echo "expected '$expected'"; exit 1; }
      - name: Pack platform package
        # "./" prefix: bare "npm/<pkg>" parses as a GitHub shorthand spec and
        # npm tries to clone it over ssh instead of packing the local dir.
        run: npm pack "./npm/${{ matrix.pkg }}"
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.pkg }}
          path: "*.tgz"
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/npm-v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Pack main package
        run: npm pack ./npm/idfon
      - name: Publish all packages
        run: |
          for tgz in dist/*.tgz ./*.tgz; do
            npm publish "$tgz" --access public
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
