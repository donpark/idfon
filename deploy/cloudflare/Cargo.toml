[package]
name = "idfon-edge-worker"
version = "0.8.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = "0.8"
iroh = "1.3"
iroh-h3-client = "0.5"
idfon-core = { path = "../../crates/idfon-core" }
idfon-protocol = { path = "../../crates/idfon-protocol" }
http = "1"
futures-lite = "2"
n0-future = "0.3"
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
tracing = "0.1"
tracing-wasm = "0.2"
console_error_panic_hook = "0.1"
js-sys = "0.3.106"

# Standalone: this is a wasm cdylib, not a native workspace member.
[workspace]
