# iroh-relay config for the co-located enterprise relay (issue #26).
# Mounted at /config/config.toml. The wildcard cert covers relay.<domain>.
#
# Why: enterprise NAT is usually symmetric/CGNAT, so direct UDP hole-punching
# fails, and many networks allow only outbound TCP 443. The relay's WebSocket
# transport (wss://…:8443) traverses that; QUIC address discovery (udp/7842)
# only helps when UDP is permitted.

enable_relay = true
enable_quic_addr_discovery = true
# Captive-portal HTTP; keep it off 80/443 (the edge owns those), unpublished.
http_bind_addr = "[::]:8080"
metrics_bind_addr = "[::]:9090"

# Access control (fail-closed: this default admits nobody — an empty
# allowlist). The relay handshake authenticates each client's endpoint id
# (TLS key export) before this hook runs, so id-based decisions are
# trustworthy. scripts/deploy-digitalocean.sh rewrites this line from its
# environment (allowlist / http callout / shared_token) and refuses to deploy
# with no auth at all unless IDFON_RELAY_OPEN=1 deliberately asks for:
#   access = "everyone"                       # open relay — dev only
# Shared-token clients present IDFON_RELAY_TOKEN (apps: Relay Settings);
# the relay itself can override its token list via IROH_RELAY_ACCESS_TOKEN.
access = { allowlist = [] }

[tls]
# 443 belongs to the edge, so the relay URL carries its port:
#   https://relay.<domain>:8443
https_bind_addr = "[::]:8443"
quic_bind_addr = "[::]:7842"
cert_mode = "Manual"
manual_cert_path = "/etc/idfon-edge/cert.pem"
manual_key_path = "/etc/idfon-edge/key.pem"
