#cloud-config
# Optional user-data for the idfon-edge droplet: Docker + the state directory.
package_update: true
packages:
  - docker.io
  - docker-compose-v2
runcmd:
  - systemctl enable --now docker
  - mkdir -p /etc/idfon-edge /srv/idfon-edge
  # The idfon-edge image runs as uid 10001; let it write the identity key.
  - chown 10001:10001 /srv/idfon-edge
